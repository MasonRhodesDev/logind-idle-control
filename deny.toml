# cargo-deny configuration — supply-chain gate for a session daemon that
# holds logind inhibitor locks.
# Run locally with `cargo deny check`; CI runs it on PRs, pushes, and weekly.

[advisories]
version = 2
yanked = "deny"
# Add RUSTSEC IDs here (with a justifying comment) only if an advisory is
# confirmed not to affect us and a fix isn't yet available.
ignore = [
    # zvariant, zbus_names and zvariant_derive are unmaintained (folded into
    # zbus 6). They reach the tree only through the optional `tray` feature:
    # ksni 0.3.7, its newest release, still requires zbus 5. The default
    # build is on zbus 6 and carries none of them. Unmaintained, not a known
    # vulnerability. Drop these three once ksni moves to zbus 6.
    # Reviewed 2026-11-20.
    { id = "RUSTSEC-2026-0370", reason = "tray feature only, via ksni's zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "tray feature only, via ksni's zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "tray feature only, via ksni's zbus 5" },
]

[licenses]
version = 2
# Permissive set actually present in the tree (see `cargo metadata`), plus
# MPL-2.0 for option-ext (a `dirs` dependency; file-level copyleft is fine —
# we don't modify it). The one `... OR LGPL-2.1-or-later` dep (r-efi) is
# satisfied by its MIT/Apache alternative, so LGPL is intentionally NOT
# allowed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# No local path deps today; kept on so adding a workspace crate later doesn't
# trip the wildcard ban. Still catches a real `foo = "*"` registry wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
